<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converse Code</title>
<style>
:root{color-scheme:dark;--bg:#11120f;--panel:#1b1d19;--text:#eee9df;--muted:#979d92;--line:#343832;--accent:#ed765f;--ok:#9abb9e;--user-bg:#35221e;--user-line:#78483f;--assistant-bg:#192622;--assistant-line:#426158}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
header,main,footer{width:min(760px,calc(100% - 2rem));margin:0 auto}header{display:flex;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
h1{font-size:1rem;margin:0}.badge{margin-left:auto;color:var(--ok);font:12px ui-monospace,monospace}main{height:100%;min-height:0;padding:1rem 0;overflow:auto}.empty{color:var(--muted);text-align:center;margin-top:20vh}
.entry{max-width:85%;padding:.7rem .85rem;margin:.6rem 0;border:1px solid var(--line);border-radius:.7rem;background:var(--panel);white-space:pre-wrap}.entry::before{content:attr(data-label);display:block;margin-bottom:.3rem;color:var(--muted);font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}.user{margin-left:auto;background:var(--user-bg);border-color:var(--user-line)}.user::before{color:#f49a87}.assistant{margin-right:auto;background:var(--assistant-bg);border-color:var(--assistant-line)}.assistant::before{color:#a9cfb7}.activity{max-width:100%;padding:.55rem .7rem;color:var(--muted);background:transparent;text-align:left;border-style:dashed;font:13px/1.45 ui-monospace,monospace}.activity::before{display:inline;margin-right:.7rem;color:#c1b9a8}
footer{display:flex;align-items:center;justify-content:center;gap:1rem;padding:1rem 0}.hint,#notice{color:var(--muted);margin:0}button{font:inherit;border:1px solid var(--accent);border-radius:.65rem;padding:.8rem 1.2rem;background:var(--accent);color:#1a0c08;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--text);border-color:var(--line)}button:disabled{opacity:.55}
</style>
</head>
<body>
<header><h1>Converse Code</h1><span id="status" class="badge">connecting</span></header>
<main id="log"><p id="empty" class="empty">Speak to drive the visible Pi terminal.</p></main>
<footer>
  <p class="hint">Live speech, replies, and coding activity</p>
  <button id="voice" aria-pressed="false">Start voice</button>
  <button id="end-session" class="secondary">End session</button>
  <p id="notice" role="status"></p>
</footer>
<script type="module">
const token=new URLSearchParams(location.search).get("t")||"";
const log=document.querySelector("#log"),empty=document.querySelector("#empty");
const voice=document.querySelector("#voice"),endSession=document.querySelector("#end-session"),status=document.querySelector("#status"),notice=document.querySelector("#notice");
// One tagged voice-session state. The delivery epoch and microphone exist only inside
// "live", so "ended with a live delivery" or "microphone after end" cannot be represented.
// {kind:"idle"}
// {kind:"opening",promise,instance:null|client}
// {kind:"live",client,delivery:null|{client},mic:"off"|"listening"|"muted"}
// {kind:"ended"}
let session={kind:"idle"};
let micState="idle",flushing=false;const seqs=new Map();
let audioDiagnostics=false,audioCapture=null;
const userRows=new Map(),assistantRows=new Map(),renderedControls=new Set();
const deferredIds=new Set();
const deferredAcks=new Map();
const instructions=`You are Converse Code, the voice interface to Pi. Pi is the authoritative source for its coding session. For every request or question concerning Pi or that session, call pi_request; never answer it yourself. Put the user's request in user_request; never replace it with your own narration, an inferred answer, or a claim that work already happened. Report outcomes only from Pi's returned evidence.`;

const labels={user:"You",assistant:"Converse Code",activity:"Activity"};
function followBottom(){log.scrollTop=log.scrollHeight}
function row(kind,text,label=labels[kind]){empty?.remove();const el=document.createElement("div");el.className=`entry ${kind}`;el.dataset.label=label;el.setAttribute("aria-label",label);el.textContent=text;log.append(el);followBottom();return el}
function activity(text,label="Activity"){if(text)row("activity",text,label)}
function wireSend(frame){if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(frame))}
function debugTrace(name,data={}){wireSend({type:"local",event:"debug_trace",name,data})}
function beginAudioCapture(turnId){
  if(!audioDiagnostics)return;
  audioCapture={turnId,sampleRate:16000,sampleCount:0,startedAt:performance.now(),last:null,parts:[],chunks:[]};
}
function captureAudio(client,event){
  const capture=audioCapture,samples=event.samples;
  if(!capture||!samples||!samples.length)return;
  const receivedAt=performance.now(),pcm=new Int16Array(samples.length);
  let peak=0,hash=2166136261;
  for(let index=0;index<samples.length;index++){
    const sample=Math.max(-1,Math.min(1,samples[index]));
    const value=sample<0?Math.round(sample*32768):Math.round(sample*32767);
    pcm[index]=value;peak=Math.max(peak,Math.abs(sample));
    hash=Math.imul(hash^(value&0xffff),16777619)>>>0;
  }
  const context=client.player?.context;
  capture.sampleRate=event.sr||capture.sampleRate;
  capture.parts.push(pcm);capture.sampleCount+=pcm.length;
  capture.chunks.push({
    sequence:capture.chunks.length,
    received_ms:Math.round((receivedAt-capture.startedAt)*1000)/1000,
    samples:pcm.length,hash,
    boundary_jump:capture.last===null?null:Math.abs(samples[0]-capture.last),
    peak,
    pending_ms:Math.round((client.player?.pendingMs?.()||0)*1000)/1000,
    context_state:context?.state||null,
    context_time:context?Math.round(context.currentTime*1000000)/1000000:null,
  });
  capture.last=samples[samples.length-1];
}
function finishAudioCapture(turnId){
  const capture=audioCapture;
  if(!capture||capture.turnId!==turnId)return Promise.resolve();
  audioCapture=null;
  debugTrace("assistant_audio",{
    turn_id:capture.turnId,sample_rate:capture.sampleRate,
    sample_count:capture.sampleCount,chunks:capture.chunks,
  });
  if(!capture.sampleCount)return Promise.resolve();
  const pcm=new Int16Array(capture.sampleCount);let offset=0;
  for(const part of capture.parts){pcm.set(part,offset);offset+=part.length}
  const upload=fetch(`/audio-diagnostic?t=${encodeURIComponent(token)}`,{
    method:"POST",headers:{"Content-Type":"application/octet-stream","X-Turn-Id":capture.turnId},body:pcm.buffer,
  }).then(response=>{if(!response.ok)throw new Error(`audio diagnostic upload failed: ${response.status}`)})
    .catch(error=>debugTrace("assistant_audio_save_failed",{turn_id:capture.turnId,error:String(error.message||error)}));
  return upload;
}
// The badge is a projection of one observation over (session, micState, deferred tasks):
// ended, else a microphone alert, else working while a deferred task runs, else the mic state.
function renderStatus(){
  if(session.kind==="ended"){status.textContent="ended";return}
  const alert=["warming up","recovering","failed"].includes(micState);
  status.textContent=alert?micState:deferredIds.size?"working":micState;
}
function showEnded(){
  session={kind:"ended"};renderStatus();
  voice.textContent="Session ended";voice.disabled=true;voice.setAttribute("aria-pressed","false");
  endSession.disabled=true;
}
const ws=new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
ws.onopen=()=>{renderStatus()};
ws.onmessage=event=>{const frame=JSON.parse(event.data);if(frame.event==="bridge_control"){seqs.set(frame.seq,frame);flush()}};

async function liveSession(){
  if(session.kind==="live")return session;
  if(session.kind==="opening")return session.promise;
  if(session.kind==="ended")throw new Error("the session has ended");
  // The IIFE suspends at its first await before touching state, so the
  // {kind:"opening"} assignment below always lands first.
  const opening={kind:"opening",promise:null,instance:null};
  opening.promise=(async()=>{
    const sdk=await import("./vendor/dialt/index.js");
    const sessionId=sdk.createSessionId();
    const response=await fetch(`/session-credential?t=${encodeURIComponent(token)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId})});
    if(!response.ok)throw new Error(`credential request failed: ${response.status}`);
    const credential=await response.json();
    audioDiagnostics=credential.audio_diagnostics===true;
    const instance=new sdk.DialtClient({url:credential.ws_url,apiKey:credential.api_key,sessionId:credential.session_id,mode:{kind:"dialt",voice:"classic",instructions,web_search:false,silence_nudge_s:30,silence_end_s:90,tools:credential.tools||[],tool_choice:{tool:"pi_request"}}});
    opening.instance=instance;
    instance.addEventListener("event",event=>handleEvent(instance,event.detail||{}));
    if(session.kind==="ended"){instance.close();throw new Error("the session has ended")}
    await instance.unlockAudio();await instance.connect({noGreeting:true});
    if(session.kind==="ended"){instance.close();throw new Error("the session has ended")}
    session={kind:"live",client:instance,delivery:{client:instance},mic:"off"};
    wireSend({type:"local",event:"bridge_ready"});await flush();return session;
  })();
  session=opening;
  try{return await opening.promise}
  catch(error){if(session===opening)session={kind:"idle"};throw error}
}

function setPiRouting(client,busy){client.setToolChoice(busy?{allowed:["pi_request","pi_cancel"]}:{tool:"pi_request"})}
function handleEvent(client,event){
  // Exactly one instance owns the event stream: the live client, or the one
  // being opened. Anything else (stale, post-end) is dropped.
  const owner=session.kind==="live"?session.client:session.kind==="opening"?session.instance:null;
  if(owner!==client)return;
  const turnId=event.turn_id||event.message_id||"current";
  if(["warming_up","recovering","listening","failed"].includes(event.type)){
    const state=event.type,error=event.error?.message||event.error||"";
    micState=state.replace("_"," ");renderStatus();
    debugTrace("mic_state",{
      state,...(event.code?{code:event.code}:{}),...(error?{error:String(error)}:{}),
      ...(Number.isInteger(event.attempt)?{attempt:event.attempt}:{}),
      ...(Number.isInteger(event.next_attempt)?{next_attempt:event.next_attempt}:{}),
      ...(event.device_id?{device_id:event.device_id}:{}),
      ...(typeof event.recovered==="boolean"?{recovered:event.recovered}:{}),
    });
    if(state==="failed")notice.textContent=error||event.code||"Microphone capture failed";
  }
  if(event.type==="turn"){beginAudioCapture(turnId);debugTrace("voice_turn",{type:event.type,turn_id:turnId})}
  if(event.type==="audio")captureAudio(client,event);
  if(event.type==="asr"){
    const current=userRows.get(turnId)||row("user","");current.textContent=event.text||"";
    const final=event.final!==false;
    userRows.set(turnId,current);if(final)userRows.delete(turnId);followBottom();
    if(final)debugTrace("user_transcript",{turn_id:turnId,text:event.text||""});
  }
  if(event.type==="turn"&&!assistantRows.has(turnId))assistantRows.set(turnId,row("assistant",""));
  if(event.type==="text_delta"){
    const current=assistantRows.get(turnId)||row("assistant","");
    current.textContent+=event.delta||"";assistantRows.set(turnId,current);followBottom();
  }
  if(event.type==="utterance"){
    const current=assistantRows.get(turnId)||row("assistant","");
    current.textContent=event.text||event.utterance||"";assistantRows.set(turnId,current);followBottom();
    debugTrace("assistant_utterance",{turn_id:turnId,text:event.text||event.utterance||""});
  }
  if(event.type==="done"||event.type==="interrupted"||event.type==="canceled"){
    debugTrace("voice_turn",{type:event.type,turn_id:turnId,text:assistantRows.get(turnId)?.textContent||""});
    void finishAudioCapture(turnId);
  }
  if(event.type==="session_end"){
    client.stopMic();
    debugTrace("session_end",{code:event.code,reason:event.reason||""});
    showEnded();
    wireSend({type:"local",event:"session_end",code:event.code,reason:event.reason||""});
  }
  if(event.type==="tool_call")activity(`Requested ${event.name||"tool"}`,"Voice tool");
  if(event.type==="tool_call")debugTrace("tool_call",{id:event.id,name:event.name,args:event.args});
  if(event.type==="tool_call")wireSend({type:"local",event:"tool_call",call:event});
  if(event.type==="tool_cancel"){debugTrace("tool_cancel",{id:event.id});wireSend({type:"local",event:"tool_cancel",call:event})}
  if(event.type==="tool_deferred_ack"){
    const pending=deferredAcks.get(event.id);
    const valid=pending&&typeof event.accepted==="boolean"&&(!event.accepted||event.handle===pending.handle);
    debugTrace("tool_deferred_ack",{id:event.id||"",accepted:event.accepted===true,reason:event.reason||"",valid:!!valid});
    if(valid){
      deferredAcks.delete(event.id);
      if(event.accepted){renderControl(pending.frame);deferredIds.add(event.id);setPiRouting(client,true);renderStatus()}
      else activity(`Pi background task rejected: ${event.reason||"unknown reason"}`,"Background task");
      wireSend({type:"local",event:"bridge_ack",seq:pending.seq,detail:event});
    }
  }
  if(event.type==="tool_deferred_resume"&&event.handle){
    debugTrace("tool_deferred_resume",{id:event.id||"",handle:event.handle});
    if(event.id){deferredIds.add(event.id);setPiRouting(client,true);renderStatus()}
    wireSend({type:"local",event:"tool_deferred_resume",handle:event.handle});
  }
  if(event.type==="tool_job_narration"){
    const interactionIds=Array.isArray(event.interaction_ids)?event.interaction_ids:[];
    debugTrace("tool_job_narration",{state:event.state,job_ids:event.job_ids||[],interaction_ids:interactionIds,kind:event.kind||""});
    const narrationLabels={queued:"Question narration queued",started:"Question narration started",superseded:"Question narration interrupted",cancelled:"Question narration cancelled",failed:"Question narration failed"};
    activity(narrationLabels[event.state]||`Question narration ${event.state||"updated"}`,"Interaction");
    if(event.kind==="interaction"&&event.state==="cancelled"&&interactionIds.length){
      wireSend({type:"local",event:"interaction_cancelled",interaction_ids:interactionIds});
    }
  }
  if(event.type==="reconnecting"&&session.kind==="live")session.delivery=null;
  if(event.type==="reconnected"&&session.kind==="live"){session.delivery={client:session.client};wireSend({type:"local",event:"bridge_ready"});flush()}
  if(event.type==="error"){debugTrace("voice_error",{code:event.code,detail:event.detail});notice.textContent=event.detail||event.code||"Voice connection failed"}
}

function renderControl(frame){
  if(renderedControls.has(frame.seq))return;renderedControls.add(frame.seq);
  if(frame.action==="tool_deferred")activity(`${frame.status_label} accepted in the background`,"Background task");
  else if(frame.action==="tool_partial_result"){
    const content=frame.content||{},facts=content.data||content;
    if(facts.event==="pi_approval_required")activity(`${facts.tool||"tool"}: ${facts.summary||"protected action"}`,"Approval required");
    else if(facts.event==="pi_approval_superseded")activity("Approval superseded by a new request","Approval closed");
    else if(facts.event==="pi_approval_expired")activity("Approval expired unanswered","Approval closed");
    else if(facts.event==="pi_tool_started")activity(facts.tool||"Pi tool","Pi activity");
    else activity(facts.event||"Pi update","Pi activity");
  }
  else if(frame.action==="tool_result"){
    const content=frame.content||{},facts=content.data||content;
    activity(facts.pi_response||facts.message||facts.event||`Task ${frame.outcome||"finished"}`,frame.verified?"Verified":"Pi reported");
  }
  else if(frame.action==="tool_interaction_update"){
    activity(frame.note||`Approval ${frame.state||"closed"}`,"Approval closed");
  }
}

async function flush(){
  if(flushing||session.kind!=="live"||!session.delivery)return;
  flushing=true;const live=session,target=session.delivery;
  try{
    for(const [seq,frame]of [...seqs]){
      if(session!==live||live.delivery!==target)break;
      let accepted=true,detail=null;
      if(frame.action==="tool_deferred"){
        accepted=target.client.sendToolDeferred(frame.id,{handle:frame.handle,statusLabel:frame.status_label});
        if(accepted===true){deferredAcks.set(frame.id,{seq,handle:frame.handle,frame});seqs.delete(seq);continue}
      }
      else if(frame.action==="tool_partial_result"){
        const options={};
        if(frame.interaction)options.interaction=frame.interaction;
        accepted=target.client.sendToolPartialResult(frame.id,frame.content,options);
      }
      else if(frame.action==="tool_result")accepted=target.client.sendToolResult(frame.id,frame.content,{outcome:frame.outcome,verified:!!frame.verified});
      else if(frame.action==="tool_interaction_update"){
        detail=await target.client.sendToolInteractionUpdate(frame.id,frame.interaction_id,frame.state,frame.note?{note:frame.note}:{});
      }
      else{seqs.delete(seq);continue}
      if(session!==live||live.delivery!==target)break;
      if(accepted!==true){live.delivery=null;break}
      renderControl(frame);
      if(frame.action==="tool_result"&&deferredIds.delete(frame.id)){setPiRouting(target.client,false);renderStatus()}
      seqs.delete(seq);wireSend({type:"local",event:"bridge_ack",seq,...(detail?{detail}:{})});
    }
  }catch(error){if(session===live&&live.delivery===target)live.delivery=null;notice.textContent=`Voice control delivery failed: ${error.message||error}`}
  finally{flushing=false}
  if(session.kind==="live"&&session.delivery&&seqs.size)queueMicrotask(flush);
}

voice.onclick=async()=>{
  voice.disabled=true;notice.textContent="";
  try{
    const live=await liveSession();
    if(live.mic==="off"){
      await live.client.startMic({workletUrl:"./vendor/dialt/mic-worklet.js"});
      live.mic="listening";voice.textContent="Mute microphone";
    }else{
      live.mic=live.mic==="listening"?"muted":"listening";
      live.client.setMicEnabled(live.mic==="listening");
      voice.textContent=live.mic==="listening"?"Mute microphone":"Unmute microphone";
      micState=live.mic;renderStatus();
      debugTrace("mic_state",{state:live.mic});
    }
    voice.setAttribute("aria-pressed",String(live.mic==="listening"));
  }catch(error){
    if(session.kind!=="ended"){
      const message=String(error.message||error);
      notice.textContent=`Could not start voice: ${message}`;
      debugTrace("mic_start_failed",{error:message});
    }
  }
  finally{if(session.kind!=="ended")voice.disabled=false}
};
endSession.onclick=async()=>{
  if(session.kind==="ended")return;
  const previous=session;
  voice.disabled=true;endSession.disabled=true;notice.textContent="";
  // Diagnostics are evidence, never part of the lifecycle: a slow capture upload must not
  // delay the visible end state or the semantic shutdown request.
  if(audioCapture)void finishAudioCapture(audioCapture.turnId);
  showEnded();
  wireSend({type:"local",event:"end_session"});
  try{
    if(previous.kind==="live")await previous.client.closeAndWait();
    else if(previous.kind==="opening")previous.instance?.close();
  }
  catch(error){notice.textContent=`Could not close voice cleanly: ${error.message||error}`}
};
</script>
</body>
</html>

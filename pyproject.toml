[project]
name = "converse-code"
version = "0.10.10"
description = "Voice control for a visible Pi terminal using Dialt background tools"
readme = "PYPI.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/Trelis-LTD/converse-code"
Repository = "https://github.com/Trelis-LTD/converse-code"
Documentation = "https://github.com/Trelis-LTD/converse-code#readme"

[project.scripts]
converse-code = "converse_code.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.54",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser_e2e: real Chromium tests (run with scripts/browser_e2e.py)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["converse_code"]
